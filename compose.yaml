services:
  mysql:
    image: mysql:8.0
    container_name: dentcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dentcare_db
      MYSQL_USER: dentcare_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-dentcare_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dentcare_root_password}
    ports:
      - "3306:3306"
    volumes:
      - dentcare_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-dentcare_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  dentcare_mysql_data:
