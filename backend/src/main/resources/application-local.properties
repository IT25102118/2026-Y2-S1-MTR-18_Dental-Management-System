# DentCare Local Development Configuration (Zero-Download Embedded Database)
spring.datasource.url=jdbc:h2:file:./data/dentcare_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Flyway migrations for local H2 mode
spring.flyway.enabled=false

# Session Cookie Configuration for local HTTP development
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Initial Administrator Bootstrap (Login: admin@dentcare.com / Admin1234)
dentcare.security.bootstrap.enabled=true
dentcare.security.bootstrap.admin-first-name=DentCare
dentcare.security.bootstrap.admin-last-name=Admin
dentcare.security.bootstrap.admin-email=admin@dentcare.com
dentcare.security.bootstrap.admin-password=Admin1234
