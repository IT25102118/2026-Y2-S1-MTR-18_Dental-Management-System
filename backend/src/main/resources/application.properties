# DentCare Spring Boot Application Configuration
spring.application.name=dentcare

# MySQL Production Configuration (environment placeholders with safe defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dentcare_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:dentcare_user}
spring.datasource.password=${DB_PASSWORD:dentcare_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway creates the complete schema on a fresh database and safely adopts
# databases created with the repository's earlier manual SQL scripts.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Session Cookie Configuration (PR-D1)
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Initial Administrator Bootstrap Configuration (PR-D2)
dentcare.security.bootstrap.enabled=${SECURITY_BOOTSTRAP_ENABLED:false}
dentcare.security.bootstrap.admin-first-name=${SECURITY_BOOTSTRAP_ADMIN_FIRST_NAME:}
dentcare.security.bootstrap.admin-last-name=${SECURITY_BOOTSTRAP_ADMIN_LAST_NAME:}
dentcare.security.bootstrap.admin-email=${SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
dentcare.security.bootstrap.admin-password=${SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}

# H2 Console is disabled
spring.h2.console.enabled=false

# Email SMTP Transport Configuration (Disabled by default)
dentcare.email.smtp.enabled=${DENTCARE_EMAIL_SMTP_ENABLED:false}
dentcare.email.from=${DENTCARE_EMAIL_FROM:}

# Spring Mail Properties (Populated via environment when SMTP transport is enabled)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

